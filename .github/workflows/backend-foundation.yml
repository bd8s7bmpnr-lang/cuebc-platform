name: Backend foundation
on:
  push:
    branches: [main, 'backend/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUEBC_LOCAL_RUNTIME: docker
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run test:backend
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-verification
          path: .local/verification-result.json
          if-no-files-found: error
          retention-days: 14
