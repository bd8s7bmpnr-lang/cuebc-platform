# Local development only; CLI is pinned in package-lock.json.
project_id = "cuebc-platform"
[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
major_version = 17
health_timeout = "120s"
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[auth]
enabled = true
site_url = "http://127.0.0.1:8766"
additional_redirect_urls = []
enable_signup = false
[studio]
enabled = false
[storage]
enabled = false
[realtime]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
[experimental]
stack = true
